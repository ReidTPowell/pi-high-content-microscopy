[project]
name = "pi-high-content-microscopy"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ome = ["tifffile>=2024.5"]
bioformats = ["bioio>=3"]
qc = ["numpy>=1.26", "tifffile>=2024.5"]
